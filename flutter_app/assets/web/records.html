<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE-FIT 훈련 기록</title>
<!--
  ============================================================================
  RE-FIT 훈련 기록 — 치료사·보호자용 조회 화면

  서버는 폰 안에 있다(MonitorService). 데이터가 이 기기 밖으로 나가지
  않으므로 CDN·폰트·차트 라이브러리를 일절 쓰지 않는다. 외부 요청이 하나라도
  있으면 "인터넷 없이 되는 화면"이라는 성질이 깨진다.

  그래서 웹폰트도 못 쓴다. 타이포그래피는 기기에 이미 있는 것들로만 세운다 —
  한국어는 Pretendard(있으면) → Apple SD Gothic Neo 순으로 잡고, 숫자는
  tabular-nums 로 자릿수를 고정해 표와 카드에서 눈이 흔들리지 않게 한다.

  ── 지키는 것 ──────────────────────────────────────────────────────────────

  1) 판정하지 않는다
     피로 판정의 근거는 M-wave 진폭 하나뿐이고, 그 판단은 폰의 신호 엔진이
     이미 끝냈다. 여기서는 받은 값을 그릴 뿐이다. 웹이 다시 계산하면 폰과
     웹이 서로 다른 결론을 말하게 된다.

     지난 세션 대비 증감(델타)만 예외로 표시한다. 이것은 서버가 이미 준 두
     숫자의 뺄셈이지 판정이 아니다. 대신 **피로 지표에는 델타를 붙이지
     않는다** — 피로가 늘고 줄었다는 화살표는 곧 판정으로 읽힌다.

  2) RMS·MDF 는 관찰용이라고 화면에 적는다
     완전마비 환자의 EMG 에는 자발 성분이 없어 이 둘은 근육 상태가 아니라
     자극 하모닉을 재는 값이다. 라벨을 안 붙이면 "RMS 가 떨어졌으니 피로"
     라는 오독이 반드시 생긴다. 카드 제목 옆의 배지가 그 역할을 한다.

  3) 환자 간 비교·순위를 만들지 않는다
     목록은 폰에서 선택된 환자 하나로 이미 좁혀져 온다. 비교는 언제나 같은
     환자의 과거 자신하고만 한다.

  4) DOM 은 textContent 로만 채운다
     세션 데이터에는 환자 이름처럼 사람이 입력한 문자열이 섞인다. 문자열을
     이어 붙여 innerHTML 로 밀어 넣는 습관이 한 군데라도 있으면 그 경로가
     곧 주입 통로가 된다. 여기서는 el()·svg() 헬퍼만 쓴다.

  ── 차트에 축을 그리는 이유 ────────────────────────────────────────────────

  예전에는 축·눈금을 일부러 뺐다. "모양만 보면 된다, 절대값은 아래 표에
  있다"는 논리였는데, 실제로는 표까지 내려가 눈으로 행을 세는 일이 생겼다.
  지금은 최소한의 격자와 양 끝 눈금을 두고, 그래프 위에 마우스를 얹으면
  그 시점의 값을 바로 읽어 준다. 표는 여전히 전부를 담는 곳으로 남는다.
  ============================================================================
-->
<style>
  :root{
    /* 밝은 임상용 팔레트. 앱(어두운 화면)과 달리 이 화면은 노트북에서
       오래 들여다보는 곳이라 눈이 편한 쪽으로 잡았다. */
    --page:#F3F6F8;
    --card:#FFFFFF;
    --line:#E4EAEE;
    --line-soft:#EEF2F5;
    --ink:#0E1C22;
    --soft:#54666F;
    --faint:#8B9AA3;

    --brand:#0E9B7C;          /* RE-FIT 청록 — 밝은 배경용으로 낮춘 명도 */
    --brand-ink:#0A7360;
    --brand-weak:#E4F4F0;
    --amber:#B9722A;
    --amber-weak:#FAF0E4;
    --yellow:#A8820F;
    --alert:#BE4F36;

    --shadow:0 1px 2px rgba(14,28,34,.04), 0 8px 24px rgba(14,28,34,.05);
    --radius:14px;
    --sidebar:264px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard Variable",
         Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* 숫자는 어디서나 자릿수를 고정한다 — 값이 갱신될 때 폭이 흔들리지 않는다 */
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

  .shell{display:flex; min-height:100vh; align-items:stretch}

  /* ── 사이드바 = 세션 목록 ─────────────────────────────────────────────
     참고한 관리자 화면의 좌측 메뉴 자리에 세션 목록을 둔다. 이 화면에서
     "이동"이라는 행위는 곧 다른 세션을 여는 것이기 때문이다. */
  .side{
    width:var(--sidebar); flex:0 0 var(--sidebar); background:var(--card);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:20px 20px 16px; border-bottom:1px solid var(--line-soft);
  }
  .brand .mark{
    width:30px; height:30px; border-radius:9px; flex:0 0 30px;
    background:linear-gradient(145deg,var(--brand),#12C39C);
    display:grid; place-items:center; color:#fff;
    box-shadow:0 2px 8px rgba(14,155,124,.32);
  }
  .brand b{font-size:16px; letter-spacing:-.01em}
  .brand .sub{font-size:11px; color:var(--faint); letter-spacing:.06em}

  .side-head{
    padding:16px 20px 8px; display:flex; align-items:baseline; gap:8px;
  }
  .side-head b{font-size:12px; letter-spacing:.08em; color:var(--faint);
               font-weight:700; text-transform:uppercase}
  .side-head .count{margin-left:auto; font-size:12px; color:var(--faint)}
  .side-list{overflow:auto; padding:0 12px 16px; flex:1}

  .item{
    display:block; width:100%; text-align:left; border:1px solid transparent;
    background:transparent; border-radius:11px; padding:11px 12px;
    cursor:pointer; font:inherit; color:inherit; margin-bottom:2px;
    transition:background .14s ease, border-color .14s ease;
  }
  .item:hover{background:#F6F9FA}
  .item.on{background:var(--brand-weak); border-color:rgba(14,155,124,.28)}
  .item .when{font-weight:600; font-size:14px; display:flex;
              align-items:center; gap:6px}
  .item .sub{font-size:12.5px; color:var(--soft); margin-top:3px}
  .item.on .sub{color:var(--brand-ink)}

  /* ── 본문 ─────────────────────────────────────────────────────────── */
  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{
    display:flex; align-items:center; gap:14px; padding:14px 28px;
    background:var(--card); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .who{display:flex; align-items:center; gap:10px; min-width:0}
  .avatar{
    width:34px; height:34px; border-radius:50%; flex:0 0 34px;
    background:var(--brand-weak); color:var(--brand-ink);
    display:grid; place-items:center; font-weight:700; font-size:14px;
  }
  .who .name{font-weight:650; font-size:15px; line-height:1.2;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .who .meta{font-size:12px; color:var(--faint); line-height:1.2}
  .spacer{margin-left:auto}
  .btn{
    display:inline-flex; align-items:center; gap:7px; font:inherit;
    font-size:13.5px; font-weight:600; padding:9px 15px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    cursor:pointer; transition:background .14s, border-color .14s;
    text-decoration:none; white-space:nowrap;
  }
  .btn:hover{background:#F6F9FA; border-color:#D5DDE3}
  .btn.primary{
    background:var(--brand); border-color:var(--brand); color:#fff;
    box-shadow:0 2px 8px rgba(14,155,124,.26);
  }
  .btn.primary:hover{background:var(--brand-ink); border-color:var(--brand-ink)}

  .content{padding:24px 28px 40px; max-width:1240px; width:100%}
  .page-head{display:flex; align-items:flex-end; gap:16px; margin-bottom:20px;
             flex-wrap:wrap}
  .page-head h1{margin:0; font-size:23px; font-weight:700; letter-spacing:-.02em}
  .page-head .lead{color:var(--soft); font-size:14px; margin-top:3px}

  .grid{display:grid; gap:16px}
  .g-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g-split{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
           align-items:start}
  .g-two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid+.grid{margin-top:16px}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;
  }
  .card-head{display:flex; align-items:center; gap:9px; margin-bottom:14px}
  .card-head b{font-size:14.5px; font-weight:650; letter-spacing:-.01em}
  .card-head .right{margin-left:auto}

  /* 통계 카드 — 아이콘 타일 + 큰 숫자 + 증감 배지 */
  .stat{display:flex; align-items:flex-start; gap:13px}
  .tile{
    width:42px; height:42px; flex:0 0 42px; border-radius:12px;
    display:grid; place-items:center; background:var(--brand-weak);
    color:var(--brand-ink);
  }
  .tile.amber{background:var(--amber-weak); color:var(--amber)}
  .tile.slate{background:#EDF1F4; color:var(--soft)}
  .stat .label{font-size:13px; color:var(--soft)}
  .stat .value{font-size:26px; font-weight:700; letter-spacing:-.02em;
               line-height:1.22; margin-top:2px}
  .stat .value .unit{font-size:14px; font-weight:600; color:var(--faint);
                     margin-left:3px; letter-spacing:0}

  .delta{
    display:inline-flex; align-items:center; gap:3px; margin-left:auto;
    font-size:12px; font-weight:650; padding:4px 8px; border-radius:20px;
    background:#EDF1F4; color:var(--soft); white-space:nowrap;
  }
  .delta.up{background:var(--brand-weak); color:var(--brand-ink)}
  .delta.down{background:var(--amber-weak); color:var(--amber)}

  /* 배지 — "관찰용" 처럼 오독을 막는 라벨 */
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px;
    font-weight:650; padding:3px 9px; border-radius:20px;
    background:#EDF1F4; color:var(--soft); white-space:nowrap;
  }
  .badge.key{background:var(--brand-weak); color:var(--brand-ink)}
  .badge.warn{background:var(--amber-weak); color:var(--amber)}
  .chip{
    display:inline-flex; align-items:center; font-size:11px; font-weight:650;
    padding:2px 7px; border-radius:20px; border:1px solid currentColor;
  }
  .g-A{color:var(--brand-ink)} .g-B{color:var(--yellow)} .g-C{color:var(--amber)}
  .dot{width:6px; height:6px; border-radius:50%; background:currentColor;
       flex:0 0 6px}

  /* 차트 */
  .plot{position:relative}
  .plot svg{display:block; width:100%; height:168px; overflow:visible}
  .plot.sm svg{height:118px}
  .axis{display:flex; justify-content:space-between; margin-top:7px;
        font-size:11.5px; color:var(--faint)}
  .yhead{display:flex; justify-content:space-between; font-size:11.5px;
         color:var(--faint); margin-bottom:4px}
  .tip{
    position:absolute; transform:translate(-50%,-100%); pointer-events:none;
    background:var(--ink); color:#fff; font-size:12px; font-weight:600;
    padding:5px 9px; border-radius:8px; white-space:nowrap; opacity:0;
    transition:opacity .12s; margin-top:-9px;
  }
  .tip.on{opacity:1}
  .tip .t{color:rgba(255,255,255,.62); font-weight:500; margin-left:6px}

  /* 표 */
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line-soft)}
  th{color:var(--faint); font-weight:650; font-size:12px; letter-spacing:.02em;
     position:sticky; top:0; background:var(--card)}
  tbody tr:last-child td{border-bottom:none}
  td.r,th.r{text-align:right}
  .kv td:first-child{color:var(--soft)}
  .kv td:last-child{text-align:right; font-weight:600}
  .scroll{max-height:340px; overflow:auto; border:1px solid var(--line-soft);
          border-radius:11px}

  .empty{
    color:var(--soft); padding:40px 20px; text-align:center;
    white-space:pre-line; font-size:14px;
  }
  .empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:6px}

  /* 화면이 좁으면 사이드바를 위로 접어 올린다 */
  @media (max-width:980px){
    .g-stats{grid-template-columns:1fr}
    .g-split,.g-two{grid-template-columns:1fr}
  }
  @media (max-width:820px){
    .shell{flex-direction:column}
    .side{width:auto; flex:none; height:auto; position:static;
          border-right:none; border-bottom:1px solid var(--line)}
    .side-list{max-height:210px}
    .content{padding:18px 16px 32px}
    .topbar{padding:12px 16px}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="mark" id="mark"></span>
      <span>
        <b>RE-FIT</b>
        <span class="sub" style="display:block">TRAINING RECORDS</span>
      </span>
    </div>
    <div class="side-head">
      <b>세션</b>
      <span class="count" id="count"></span>
    </div>
    <div class="side-list" id="list"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="who">
        <span class="avatar" id="avatar">·</span>
        <span style="min-width:0">
          <span class="name" id="who">불러오는 중…</span>
          <span class="meta" id="whoMeta">폰에서 선택된 환자</span>
        </span>
      </div>
      <span class="spacer"></span>
      <a class="btn" id="livelink" href="#">실시간 화면 열기</a>
    </div>
    <div class="content" id="detail"></div>
  </div>
</div>

<script>
'use strict';

// 접속 토큰은 주소에 있다. 모든 요청에 그대로 붙인다.
const K = new URLSearchParams(location.search).get('k') || '';
// 실패 이유를 삼키지 않는다. 403(접속 코드 틀림)과 500(폰 쪽 오류)은 치료사가
// 취해야 할 행동이 완전히 다르고, 500 이면 **폰이 본문에 적어 보낸 예외 한
// 줄**이 유일한 단서다. 그래서 상태 코드만이 아니라 본문까지 끌어 올린다.
//
// 본문을 먼저 text 로 받는 이유: 빈 응답에 `r.json()` 을 바로 걸면
// `Unexpected end of JSON input` 이라는, 원인과 아무 상관 없는 메시지가 뜬다.
const api = (p) =>
  fetch(p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(K))
    .then(async (r) => {
      const text = await r.text();
      if (!r.ok) {
        throw new Error('HTTP ' + r.status + (text ? ' — ' + text.trim() : ''));
      }
      if (!text.trim()) {
        throw new Error('HTTP ' + r.status + ' 인데 본문이 비어 있습니다');
      }
      try {
        return JSON.parse(text);
      } catch (_) {
        throw new Error('응답이 JSON 이 아닙니다: ' + text.slice(0, 120));
      }
    });

document.getElementById('livelink').href = '/?k=' + encodeURIComponent(K);

/// 노드 하나. 텍스트는 **항상 textContent** 로 들어간다.
const el = (t, c, txt) => {
  const n = document.createElement(t);
  if (c) n.className = c;
  if (txt !== undefined) n.textContent = txt;
  return n;
};

const NS = 'http://www.w3.org/2000/svg';
/// SVG 노드 하나. 속성은 문자열 조립 없이 setAttribute 로만 넣는다.
const svgEl = (t, attrs) => {
  const n = document.createElementNS(NS, t);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

const mount = (parent, ...kids) => { parent.append(...kids); return parent; };

// ── 아이콘 (외부 아이콘 폰트를 못 쓰므로 직접 그린다) ──────────────────
function icon(name, size) {
  const s = size || 20;
  const svg = svgEl('svg', {
    viewBox: '0 0 24 24', width: s, height: s, fill: 'none',
    stroke: 'currentColor', 'stroke-width': '1.9',
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
  });
  const paths = {
    hand: ['M8 11V5.5a1.5 1.5 0 0 1 3 0V11', 'M11 11V4.5a1.5 1.5 0 0 1 3 0V11',
           'M14 11V6.5a1.5 1.5 0 0 1 3 0V13',
           'M8 11V9.5a1.5 1.5 0 0 0-3 0V14a7 7 0 0 0 7 7h1a7 7 0 0 0 7-7v-3'],
    clock: ['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z', 'M12 7v5l3 2'],
    target: ['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z',
             'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z', 'M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z'],
    pulse: ['M3 12h3.5l2.5-7 4 14 2.5-7H21'],
    spark: ['M12 3v3', 'M12 18v3', 'M3 12h3', 'M18 12h3',
            'M5.6 5.6 7.8 7.8', 'M16.2 16.2l2.2 2.2',
            'M18.4 5.6 16.2 7.8', 'M7.8 16.2 5.6 18.4'],
    table: ['M4 5h16v14H4z', 'M4 10h16', 'M10 10v9'],
    bolt: ['M13 3 5 14h6l-1 7 8-11h-6l1-7Z'],
  };
  (paths[name] || paths.pulse).forEach(d => svg.appendChild(svgEl('path', { d })));
  return svg;
}

// ── 서식 ──────────────────────────────────────────────────────────────
const fmtDur = (s) => {
  const m = Math.floor(s / 60), r = s % 60;
  return m === 0 ? r + '초' : m + '분 ' + r + '초';
};

const fmtWhen = (iso) => {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 '
       + p(d.getHours()) + ':' + p(d.getMinutes());
};

/// 수행 성공률은 **퍼센트 대신 비율 문장**으로 쓴다. 폰 화면과 같은 언어다.
const fmtRate = (r) => '10번 중 ' + Math.round(r * 10) + '번';

const num = (v, n) => (v === null || v === undefined || isNaN(v))
  ? '—' : Number(v).toFixed(n);

// ── 차트 ──────────────────────────────────────────────────────────────
//
// 선 하나 + 옅은 면 + 최소 격자. 마우스를 얹으면 그 시점의 값을 읽어 준다.
// 텍스트는 SVG 밖(HTML)에 둔다 — preserveAspectRatio="none" 으로 가로를
// 늘리면 SVG 안의 글자는 함께 늘어나 뭉개지기 때문이다.
function plot(opts) {
  const values = opts.values || [];
  const times = opts.times || [];
  const color = opts.color;
  const small = !!opts.small;

  const box = el('div', 'plot' + (small ? ' sm' : ''));
  const W = 600, H = small ? 118 : 168, PAD = 8;

  const clean = values
    .map((v, i) => ({ v, i }))
    .filter(o => o.v !== null && o.v !== undefined && !isNaN(o.v));

  if (clean.length < 2) {
    box.appendChild(el('div', 'empty', '표시할 데이터가 없어요'));
    return box;
  }

  const lo = Math.min(...clean.map(o => o.v));
  const hi = Math.max(...clean.map(o => o.v));
  const span = (hi - lo) || 1;
  const x = (i) => PAD + (W - 2 * PAD) * i / (values.length - 1);
  const y = (v) => H - PAD - (v - lo) / span * (H - 2 * PAD);

  // y 눈금: 최대·최소만. 중간값은 격자선으로 암시한다.
  const yhead = el('div', 'yhead');
  yhead.appendChild(el('span', 'num', num(hi, opts.digits ?? 0)));
  yhead.appendChild(el('span', 'num', num(lo, opts.digits ?? 0)));
  box.appendChild(yhead);

  const svg = svgEl('svg', {
    viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none',
  });

  for (let g = 0; g <= 3; g++) {
    const gy = PAD + (H - 2 * PAD) * g / 3;
    svg.appendChild(svgEl('line', {
      x1: 0, x2: W, y1: gy, y2: gy, stroke: '#EEF2F5', 'stroke-width': 1,
      'vector-effect': 'non-scaling-stroke',
    }));
  }

  // 피로가 시작된 지점부터 옅은 호박색 음영. 빨강은 기기 문제 전용이다.
  const sf = opts.shadeFrom;
  if (sf !== null && sf !== undefined && sf >= 0 && sf < 1) {
    svg.appendChild(svgEl('rect', {
      x: PAD + (W - 2 * PAD) * sf, y: 0,
      width: (W - 2 * PAD) * (1 - sf), height: H,
      fill: 'rgba(185,114,42,.10)',
    }));
  }

  let line = '';
  clean.forEach((o, n) => {
    line += (n === 0 ? 'M' : 'L') + x(o.i).toFixed(1) + ' ' + y(o.v).toFixed(1);
  });

  const gid = 'g' + Math.random().toString(36).slice(2, 9);
  const defs = svgEl('defs');
  const grad = svgEl('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': color, 'stop-opacity': .22 }));
  grad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': color, 'stop-opacity': 0 }));
  defs.appendChild(grad);
  svg.appendChild(defs);

  svg.appendChild(svgEl('path', {
    d: line + 'L' + x(clean[clean.length - 1].i).toFixed(1) + ' ' + (H - PAD)
       + 'L' + x(clean[0].i).toFixed(1) + ' ' + (H - PAD) + 'Z',
    fill: 'url(#' + gid + ')',
  }));
  svg.appendChild(svgEl('path', {
    d: line, fill: 'none', stroke: color, 'stroke-width': 2,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    'vector-effect': 'non-scaling-stroke',
  }));

  const guide = svgEl('line', {
    y1: 0, y2: H, stroke: color, 'stroke-width': 1, 'stroke-dasharray': '3 3',
    'vector-effect': 'non-scaling-stroke', opacity: 0,
  });
  const dot = svgEl('circle', {
    r: 4, fill: '#fff', stroke: color, 'stroke-width': 2,
    'vector-effect': 'non-scaling-stroke', opacity: 0,
  });
  svg.appendChild(guide);
  svg.appendChild(dot);
  box.appendChild(svg);

  const axis = el('div', 'axis');
  const t0 = times.length ? times[0] : 0;
  const t1 = times.length ? times[times.length - 1] : values.length - 1;
  axis.appendChild(el('span', 'num', num(t0, 0) + 's'));
  axis.appendChild(el('span', 'num', num(t1, 0) + 's'));
  box.appendChild(axis);

  const tip = el('div', 'tip');
  const tipV = el('span', 'num');
  const tipT = el('span', 't');
  mount(tip, tipV, tipT);
  box.appendChild(tip);

  // viewBox 좌표(0..W, 0..H)와 화면 픽셀은 배율이 다르다. 게다가 .plot 박스
  // 안에는 SVG 위아래로 눈금 줄이 더 있어서, 말풍선을 SVG 높이 비율로
  // 앉히면 그만큼 어긋난다. 두 사각형의 차이를 직접 재서 픽셀로 앉힌다.
  const move = (ev) => {
    const sr = svg.getBoundingClientRect();
    if (!sr.width) return;
    const frac = Math.max(0, Math.min(1, (ev.clientX - sr.left) / sr.width));
    const want = frac * (values.length - 1);
    let best = clean[0], bd = Infinity;
    clean.forEach(o => {
      const d = Math.abs(o.i - want);
      if (d < bd) { bd = d; best = o; }
    });
    guide.setAttribute('x1', x(best.i));
    guide.setAttribute('x2', x(best.i));
    guide.setAttribute('opacity', 1);
    dot.setAttribute('cx', x(best.i));
    dot.setAttribute('cy', y(best.v));
    dot.setAttribute('opacity', 1);
    tipV.textContent = num(best.v, opts.digits ?? 0) + (opts.unit || '');
    tipT.textContent = times[best.i] !== undefined
      ? num(times[best.i], 1) + 's' : '';
    const br = box.getBoundingClientRect();
    tip.style.left = ((sr.left - br.left) + (x(best.i) / W) * sr.width) + 'px';
    tip.style.top = ((sr.top - br.top) + (y(best.v) / H) * sr.height) + 'px';
    tip.classList.add('on');
  };
  const leave = () => {
    guide.setAttribute('opacity', 0);
    dot.setAttribute('opacity', 0);
    tip.classList.remove('on');
  };
  box.addEventListener('pointermove', move);
  box.addEventListener('pointerleave', leave);

  return box;
}

function chartCard(title, badge, badgeKind, plotNode) {
  const card = el('div', 'card');
  const head = el('div', 'card-head');
  head.appendChild(icon(badgeKind === 'key' ? 'pulse' : 'spark', 18));
  head.appendChild(el('b', null, title));
  if (badge) {
    const b = el('span', 'badge ' + (badgeKind === 'key' ? 'key' : ''), badge);
    b.classList.add('right');
    head.appendChild(b);
  }
  card.appendChild(head);
  card.appendChild(plotNode);
  return card;
}

// ── 통계 카드 ─────────────────────────────────────────────────────────
//
// 증감은 **같은 환자의 직전 세션**하고만 비교한다(하드 제약 3). 다른 환자와
// 견주는 숫자는 이 화면에 존재하지 않는다.
function statCard(iconName, tone, label, value, unit, delta) {
  const card = el('div', 'card');
  const row = el('div', 'stat');

  const tile = el('span', 'tile' + (tone ? ' ' + tone : ''));
  tile.appendChild(icon(iconName, 21));
  row.appendChild(tile);

  const mid = el('div');
  mid.style.minWidth = '0';
  mid.appendChild(el('div', 'label', label));
  const v = el('div', 'value num', value);
  if (unit) v.appendChild(el('span', 'unit', unit));
  mid.appendChild(v);
  row.appendChild(mid);

  if (delta) {
    const d = el('span', 'delta ' + delta.dir);
    d.appendChild(el('span', null,
      delta.dir === 'up' ? '▲' : delta.dir === 'down' ? '▼' : '·'));
    d.appendChild(el('span', 'num', delta.text));
    row.appendChild(d);
  }
  card.appendChild(row);
  if (delta) {
    const note = el('div', null, '지난 세션 대비');
    note.style.cssText = 'font-size:11.5px;color:var(--faint);margin-top:9px';
    card.appendChild(note);
  }
  return card;
}

/// 두 값의 증감. 이전 세션이 없으면 null (배지를 아예 안 그린다).
function delta(now, prev, fmt) {
  if (prev === null || prev === undefined || isNaN(prev)) return null;
  const d = now - prev;
  if (Math.abs(d) < 1e-9) return { dir: 'flat', text: '변화 없음' };
  return { dir: d > 0 ? 'up' : 'down', text: fmt(Math.abs(d)) };
}

// ── 세부 ──────────────────────────────────────────────────────────────

let SESSIONS = [];   // 목록(요약)만 담는다 — 직전 세션과의 비교에 쓴다.

function renderDetail(d) {
  const box = document.getElementById('detail');
  const parts = [];

  // 이 세션의 바로 다음(더 오래된) 세션이 비교 대상이다.
  const at = SESSIONS.findIndex(s => s.id === d.id);
  const prev = (at >= 0 && at + 1 < SESSIONS.length) ? SESSIONS[at + 1] : null;

  const head = el('div', 'page-head');
  const left = el('div');
  left.appendChild(el('h1', null, fmtWhen(d.started_at) + ' 훈련'));
  left.appendChild(el('div', 'lead',
    d.onset_s === null || d.onset_s === undefined
      ? '끝까지 힘이 남았어요.'
      : fmtDur(Math.round(d.onset_s)) + '쯤부터 힘이 줄기 시작했어요.'));
  head.appendChild(left);
  const sp = el('span', 'spacer');
  head.appendChild(sp);
  const csv = el('button', 'btn primary');
  csv.appendChild(icon('table', 16));
  csv.appendChild(el('span', null, 'CSV 내려받기'));
  csv.onclick = () => downloadCsv(d);
  head.appendChild(csv);
  parts.push(head);

  // ── 통계 3장 ──
  const stats = el('div', 'grid g-stats');
  stats.appendChild(statCard('hand', null, '쥔 횟수', String(d.rep_count), '번',
    prev ? delta(d.rep_count, prev.rep_count, (x) => Math.round(x) + '번') : null));
  stats.appendChild(statCard('clock', 'slate', '운동 시간', fmtDur(d.duration_s), '',
    prev ? delta(d.duration_s, prev.duration_s, (x) => fmtDur(Math.round(x))) : null));
  stats.appendChild(statCard('target', 'amber', '수행 성공률',
    fmtRate(d.success_rate), '',
    prev ? delta(Math.round(d.success_rate * 10), Math.round(prev.success_rate * 10),
      (x) => Math.round(x) + '번') : null));
  parts.push(stats);

  const s = d.series || [];
  const times = s.map(r => r.t);
  const shade = (d.onset_s === null || d.onset_s === undefined || !d.duration_s)
    ? null : Math.max(0, Math.min(1, d.onset_s / d.duration_s));

  // ── M-wave + 분석 결과 ──
  const split = el('div', 'grid g-split');
  split.appendChild(chartCard('M-wave 진폭', '피로 판정의 근거', 'key',
    plot({ values: s.map(r => r.p2p), times, color: '#0E9B7C',
           shadeFrom: shade, digits: 0 })));

  const an = el('div', 'card');
  const anHead = el('div', 'card-head');
  anHead.appendChild(icon('bolt', 18));
  anHead.appendChild(el('b', null, '분석 결과'));
  const gr = el('span', 'chip right g-' + d.grade, '신뢰도 ' + d.grade);
  anHead.appendChild(gr);
  an.appendChild(anHead);
  const t = el('table', 'kv');
  const tb = el('tbody');
  const kv = (k, v) => {
    const tr = el('tr');
    tr.appendChild(el('td', null, k));
    tr.appendChild(el('td', 'num', v));
    tb.appendChild(tr);
  };
  kv('종료 이유', d.end_reason_label);
  kv('최대 피로', num(d.max_fatigue, 1) + '%');
  kv('종료 시점 피로', num(d.end_fatigue, 1) + '%');
  kv('레벨 변화 횟수', d.level_change_count + '회');
  kv('검출률', num(d.detect_rate, 3));
  kv('events/burst 중앙값', num(d.events_per_burst_median, 2));
  kv('자극 주기 (실측)', d.stim_period_ms + ' ms');
  kv('강도 단계', d.intensity_level + '단계');
  t.appendChild(tb);
  an.appendChild(t);
  split.appendChild(an);
  parts.push(split);

  // ── 관찰용 두 장 ──
  const two = el('div', 'grid g-two');
  two.appendChild(chartCard('RMS', '관찰용 · 판정에 쓰지 않음', 'obs',
    plot({ values: s.map(r => r.rms), times, color: '#A8820F',
           shadeFrom: shade, digits: 0, small: true })));
  two.appendChild(chartCard('MDF', '관찰용 · 판정에 쓰지 않음', 'obs',
    plot({ values: s.map(r => r.mdf), times, color: '#B9722A',
           shadeFrom: shade, digits: 0, small: true })));
  parts.push(two);

  // ── 원시 데이터 ──
  const raw = el('div', 'card');
  const rh = el('div', 'card-head');
  rh.appendChild(icon('table', 18));
  rh.appendChild(el('b', null, '원시 데이터'));
  rh.appendChild(el('span', 'badge right',
    s.length + '행 · 1kHz 파형은 저장하지 않습니다'));
  raw.appendChild(rh);

  const wrap = el('div', 'scroll');
  const rt = el('table');
  const thead = el('thead');
  const hr = el('tr');
  [['t (s)', 1], ['p2p', 1], ['피로 %', 1], ['RMS', 1], ['MDF', 1], ['수축', 0]]
    .forEach(([h, r]) => hr.appendChild(el('th', r ? 'r' : null, h)));
  thead.appendChild(hr);
  rt.appendChild(thead);
  const rb = el('tbody');
  s.forEach(r => {
    const tr = el('tr');
    [num(r.t, 1), num(r.p2p, 0), num(r.fatigue, 0), num(r.rms, 0), num(r.mdf, 0)]
      .forEach(c => tr.appendChild(el('td', 'r num', c)));
    const ok = el('td');
    const mark = el('span', 'badge' + (r.ok ? ' key' : ''), r.ok ? '성공' : '—');
    ok.appendChild(mark);
    tr.appendChild(ok);
    rb.appendChild(tr);
  });
  rt.appendChild(rb);
  wrap.appendChild(rt);
  raw.appendChild(wrap);
  parts.push(raw);

  box.replaceChildren(...parts);
}

function downloadCsv(d) {
  const lines = [
    '# session_id,' + d.id,
    '# started_at,' + d.started_at,
    '# end_reason,' + d.end_reason_label,
    '# stim_period_ms,' + d.stim_period_ms,
    't_s,p2p,fatigue,rms,mdf,contraction_ok',
  ];
  (d.series || []).forEach(r => {
    const n = (v, k) => (v === null || v === undefined) ? '' : v.toFixed(k);
    lines.push([n(r.t, 3), n(r.p2p, 2), n(r.fatigue, 2),
                n(r.rms, 2), n(r.mdf, 2), r.ok ? 1 : 0].join(','));
  });
  const blob = new Blob([lines.join('\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'refit_' + d.started_at.replace(/[:.]/g, '') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── 목록 ──────────────────────────────────────────────────────────────

const showEmpty = (box, title, text) => {
  const e = el('div', 'empty');
  if (title) e.appendChild(el('b', null, title));
  e.appendChild(el('span', null, text || ''));
  box.replaceChildren(mount(el('div', 'card'), e));
};

function select(id, node) {
  document.querySelectorAll('.item.on').forEach(n => n.classList.remove('on'));
  if (node) node.classList.add('on');
  showEmpty(document.getElementById('detail'), null, '불러오는 중…');
  api('/api/sessions/' + encodeURIComponent(id))
    .then(renderDetail)
    .catch((e) => showEmpty(document.getElementById('detail'),
      '이 기록을 불러오지 못했어요.', String(e.message || e)));
}

function renderList(data) {
  SESSIONS = data.sessions || [];

  const name = data.patient || '환자 미선택';
  document.getElementById('who').textContent = name;
  document.getElementById('whoMeta').textContent =
    SESSIONS.length + '회 훈련 기록';
  document.getElementById('avatar').textContent = name.slice(0, 1);
  document.getElementById('count').textContent = SESSIONS.length + '회';

  const box = document.getElementById('list');
  if (SESSIONS.length === 0) {
    showEmpty(box, null, '아직 기록이 없어요.');
    // 빈 카드만 덩그러니 두지 않는다 — 비어 있는 이유와 다음에 할 일을
    // 말해 주지 않으면, 화면이 고장 난 것과 구분되지 않는다.
    showEmpty(document.getElementById('detail'), '아직 훈련 기록이 없어요.',
      '폰에서 훈련을 한 번 마치면\n여기에 기록이 남습니다.');
    return;
  }

  const items = SESSIONS.map((s) => {
    const c = el('button', 'item');
    const when = el('div', 'when', fmtWhen(s.started_at));
    when.appendChild(el('span', 'chip g-' + s.grade, s.grade));
    c.appendChild(when);
    c.appendChild(el('div', 'sub',
      s.rep_count + '번 · ' + fmtDur(s.duration_s) + ' · '
      + s.end_reason_label + (s.synced ? '' : ' · 업로드 대기')));
    c.onclick = () => select(s.id, c);
    return c;
  });
  box.replaceChildren(...items);

  // 최근 것을 바로 펼쳐 둔다.
  select(SESSIONS[0].id, items[0]);
}

document.getElementById('mark').appendChild(icon('bolt', 17));
showEmpty(document.getElementById('list'), null, '불러오는 중…');
api('/api/sessions').then(renderList).catch((e) => {
  showEmpty(document.getElementById('list'), null, '연결 실패');
  showEmpty(document.getElementById('detail'), '폰과 연결하지 못했어요.',
    '같은 Wi-Fi 인지, 주소 끝의 접속 코드가 맞는지 확인해 주세요.\n('
    + String(e.message || e) + ')');
});
</script>
